! Lab configuration - simplified for demonstration
! Device: R1
! Role: Core router
! Features: OSPF, iBGP/eBGP, default route, logging
! Sensitive data removed

hostname R1
ip domain name banklab.local
ip cef
ip ssh version 2

interface Loopback0
 description ROUTER_ID
 ip address 10.255.0.1 255.255.255.255

interface Ethernet0/0
 description TO_PALOALTO_ETH1_1
 ip address 172.16.1.1 255.255.255.252

interface Ethernet0/1
 description CORE_P2P_TO_R2
 ip address 10.0.12.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LABKEY123
 ip ospf network point-to-point

interface Ethernet0/2
 description CORE_TO_DIST1_P2P
 ip address 10.0.13.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LABKEY123
 ip ospf network point-to-point

router ospf 1
 router-id 10.255.0.1
 passive-interface default
 no passive-interface Ethernet0/1
 no passive-interface Ethernet0/2
 network 10.0.12.0 0.0.0.3 area 0
 network 10.0.13.0 0.0.0.3 area 0
 network 10.255.0.1 0.0.0.0 area 0
 default-information originate

router bgp 65010
 bgp log-neighbor-changes
 neighbor 10.255.0.2 remote-as 65010
 neighbor 10.255.0.2 description IBGP_TO_R2
 neighbor 10.255.0.2 update-source Loopback0
 neighbor 203.0.113.1 remote-as 65101
 neighbor 203.0.113.1 description ISP1_EBGP_VIA_PALOALTO
 neighbor 203.0.113.1 ebgp-multihop 2
 !
 address-family ipv4
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 route-map RM-ISP1-IN in
  neighbor 203.0.113.1 route-map RM-ISP1-OUT out
 exit-address-family

ip route 0.0.0.0 0.0.0.0 172.16.1.2

ip prefix-list ISP1-IN seq 5 permit 8.8.8.8/32
ip prefix-list ISP1-IN seq 100 deny 0.0.0.0/0 le 32

ip prefix-list ISP1-OUT seq 100 deny 0.0.0.0/0 le 32

route-map RM-ISP1-IN permit 10
 match ip address prefix-list ISP1-IN

route-map RM-ISP1-OUT deny 10
 match ip address prefix-list ISP1-OUT

logging source-interface Loopback0
logging host 10.10.20.10

line vty 0 4
 transport input ssh