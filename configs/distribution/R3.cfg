! Lab configuration - simplified for demonstration
! Device: R3
! Role: Distribution router
! Features: OSPF, HSRP, VLAN gateways, tracking, logging
! Sensitive data removed

hostname R3
no ip domain lookup
ip domain name banklab.local
ip cef
ip ssh version 2

track 10 interface Ethernet0/0 line-protocol

interface Loopback0
 description ROUTER_ID
 ip address 10.255.0.3 255.255.255.255

interface Ethernet0/0
 description DIST1_TO_CORE1_P2P
 ip address 10.0.13.2 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LABKEY123
 ip ospf network point-to-point

interface Ethernet0/1
 description DIST1_TO_DIST2_P2P
 ip address 10.0.34.1 255.255.255.252
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 LABKEY123
 ip ospf network point-to-point

interface Ethernet3/0
 description DIST1_8021Q_TRUNK_TO_SW1
 no ip address

interface Ethernet3/0.10
 description VLAN10_USERS_GW_HSRP
 encapsulation dot1Q 10
 ip address 10.10.10.2 255.255.255.0
 ip helper-address 10.10.20.10
 standby version 2
 standby 10 ip 10.10.10.1
 standby 10 priority 110
 standby 10 preempt
 standby 10 track 10 decrement 30

interface Ethernet3/0.20
 description VLAN20_SERVERS_GW_HSRP
 encapsulation dot1Q 20
 ip address 10.10.20.2 255.255.255.0
 ip helper-address 10.10.20.10
 standby version 2
 standby 20 ip 10.10.20.1
 standby 20 priority 110
 standby 20 preempt
 standby 20 track 10 decrement 30

interface Ethernet3/0.99
 description VLAN99_MGMT_GW_HSRP
 encapsulation dot1Q 99
 ip address 10.10.99.2 255.255.255.0
 ip helper-address 10.10.20.10
 standby version 2
 standby 99 ip 10.10.99.1
 standby 99 priority 110
 standby 99 preempt
 standby 99 track 10 decrement 30

router ospf 1
 router-id 10.255.0.3
 passive-interface default
 no passive-interface Ethernet0/0
 no passive-interface Ethernet0/1
 network 10.0.13.0 0.0.0.3 area 0
 network 10.0.34.0 0.0.0.3 area 0
 network 10.10.10.0 0.0.0.255 area 0
 network 10.10.20.0 0.0.0.255 area 0
 network 10.10.99.0 0.0.0.255 area 0
 network 10.255.0.3 0.0.0.0 area 0

logging source-interface Loopback0
logging host 10.10.20.10

banner motd ^CUnauthorized access prohibited.^C

line vty 0 4
 transport input ssh